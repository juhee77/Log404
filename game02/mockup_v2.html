<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Archive v2 — 주희의 서재 & 소장 일기장 (UI 리디자인 목업)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #F8F5F0;
            --surface: #FFFFFF;
            --surface-soft: #F2ECE3;
            --border: #E8E0D5;
            --ink: #1F1A17;
            --ink-sub: #736860;
            --ink-muted: #A3988E;
            --accent: #C85A32;
            --accent-soft: #FDF1EC;
            --sage: #3D6B59;
            --sage-soft: #ECF4F0;
            --shadow: 0 4px 20px rgba(31, 26, 23, 0.06);
        }

        [data-theme="sepia"] {
            --bg: #F1E8D9;
            --surface: #FAF4E8;
            --surface-soft: #E8DEC9;
            --border: #DDD0BA;
            --ink: #2A2118;
            --ink-sub: #6E5F4F;
            --ink-muted: #9C8C7A;
        }

        [data-theme="dark"] {
            --bg: #171513;
            --surface: #221F1C;
            --surface-soft: #2C2824;
            --border: #36312C;
            --ink: #F3EFEA;
            --ink-sub: #ACA39A;
            --ink-muted: #766D65;
            --accent: #E27A53;
            --accent-soft: rgba(226, 122, 83, 0.14);
            --sage: #69A88E;
            --sage-soft: rgba(105, 168, 142, 0.14);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EAE5DC;
            color: var(--ink);
            font-feature-settings: "tnum";
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 12px;
        }

        /* Mobile Frame */
        .app-frame {
            width: 100%;
            max-width: 430px;
            height: 860px;
            max-height: calc(100vh - 40px);
            background: var(--bg);
            border-radius: 36px;
            box-shadow: 0 24px 60px rgba(20, 16, 12, 0.18), 0 0 0 1px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* Scrollbar */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 92px;
        }
        .scroll-area::-webkit-scrollbar { display: none; }

        /* Editorial Book Cover */
        .book-cover {
            position: relative;
            aspect-ratio: 3 / 4;
            border-radius: 6px 12px 12px 6px;
            overflow: hidden;
            box-shadow:
                inset 10px 0 14px rgba(0,0,0,0.22),
                inset 2px 0 0 rgba(255,255,255,0.25),
                0 6px 14px rgba(31,26,23,0.14);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 14px 14px 18px;
            color: #fff;
            background-size: cover;
            background-position: center;
        }
        .book-cover::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.38) 100%);
            pointer-events: none;
        }
        .book-cover::after {
            content: "";
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255,255,255,0.22);
            pointer-events: none;
        }
        .cover-pattern-grid {
            background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px);
            background-size: 12px 12px;
        }
        .cover-pattern-stripe {
            background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.07) 0 8px, transparent 8px 16px);
        }

        /* Pill Filter */
        .filter-pill {
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.18s ease;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-sub);
            cursor: pointer;
        }
        .filter-pill.active {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
        }

        /* Bottom Sheet Modal */
        .sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(18, 14, 11, 0.45);
            backdrop-filter: blur(4px);
            z-index: 40;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
        }
        .sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .sheet-panel {
            width: 100%;
            max-height: 88%;
            background: var(--bg);
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            transform: translateY(28px);
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.18);
        }
        .sheet-backdrop.open .sheet-panel {
            transform: translateY(0);
        }

        /* Segmented Control */
        .seg-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--surface-soft);
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
        }
        .seg-btn {
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-sub);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .seg-btn.active {
            background: var(--surface);
            color: var(--ink);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Floating Toast */
        .floating-toast {
            position: absolute;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.22s ease;
            z-index: 60;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        }
        .floating-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Highlighter mark */
        .hl-mark {
            background: linear-gradient(180deg, transparent 52%, rgba(255, 224, 114, 0.65) 52%);
            padding: 0 3px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-frame" id="app" data-theme="cream">
        <!-- Top Header (Clean & Minimal) -->
        <header class="px-5 pt-5 pb-3 shrink-0" style="background: var(--bg);">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-semibold tracking-wide uppercase" style="color: var(--ink-muted);" id="header-date">2026. 11. 23 · POCKET ARCHIVE</p>
                    <h1 onclick="switchTab('settings'); setTimeout(()=>document.getElementById('owner-name-input')?.focus(), 50);" class="text-[21px] font-extrabold tracking-tight mt-0.5 cursor-pointer" style="color: var(--ink);" id="library-title" title="클릭해서 서재 이름 변경">나의 서재</h1>
                </div>
                <button onclick="openAddModal()" class="px-3.5 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 cursor-pointer transition active:scale-95" style="background: var(--ink); color: var(--bg);">
                    <span>+</span><span>새 기록</span>
                </button>
            </div>

            <!-- Compact 1-Line Summary Strip (Replaces redundant 4 KPI cards) -->
            <div class="mt-3 px-3.5 py-2.5 rounded-2xl flex items-center justify-between text-[12px]" style="background: var(--surface); border: 1px solid var(--border);">
                <div class="flex items-center gap-3">
                    <span><strong class="font-bold" id="stat-items">6</strong> <span style="color: var(--ink-sub);">작품</span></span>
                    <span style="color: var(--border);">|</span>
                    <span><strong class="font-bold" style="color: var(--accent);" id="stat-vols">10</strong> <span style="color: var(--ink-sub);">권</span></span>
                    <span style="color: var(--border);">|</span>
                    <span><strong class="font-bold" style="color: var(--sage);" id="stat-rate">81%</strong> <span style="color: var(--ink-sub);">완독</span></span>
                </div>
                <span class="font-bold text-[12.5px]" id="stat-value">₩80,000</span>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="scroll-area px-5" id="view-shelf">
            <!-- Dedicated Quote Card (No truncation, full breathing room) -->
            <section class="mb-4 p-4 rounded-2xl cursor-pointer transition active:scale-[0.99]" style="background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);" onclick="cycleQuote()">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-bold tracking-wide" style="color: var(--accent);">오늘의 밑줄</span>
                    <button onclick="event.stopPropagation(); openQuoteSource()" class="text-[11px] font-semibold px-2 py-0.5 rounded-full cursor-pointer" style="background: var(--surface-soft); color: var(--ink-sub);">원문 보기 →</button>
                </div>
                <p class="text-[14.5px] font-semibold leading-relaxed" id="quote-text" style="color: var(--ink);">"농구... 좋아하세요?"</p>
                <p class="text-[12px] mt-1.5" id="quote-meta" style="color: var(--ink-sub);">슬램덩크 신장재편판 · 이노우에 다케히코</p>
            </section>

            <!-- Search & Sort Row -->
            <div class="flex items-center gap-2 mb-3">
                <div class="flex-1 relative">
                    <input id="search-input" type="text" placeholder="작품명, 작가, 밑줄 검색" oninput="renderShelf()"
                        class="w-full pl-9 pr-3 py-2.5 rounded-xl text-[13px] outline-none"
                        style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[13px]" style="color: var(--ink-muted);">🔍</span>
                </div>
                <select id="sort-select" onchange="renderShelf()" class="px-3 py-2.5 rounded-xl text-[12.5px] font-semibold outline-none cursor-pointer" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">
                    <option value="default">기본순</option>
                    <option value="rating">별점순</option>
                    <option value="value">가치순</option>
                    <option value="title">이름순</option>
                </select>
            </div>

            <!-- Clean Filter Pills -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-3 mb-1" style="scrollbar-width: none;">
                <button class="filter-pill active" data-filter="all" onclick="setFilter('all', this)">전체</button>
                <button class="filter-pill" data-filter="book" onclick="setFilter('book', this)">만화·도서</button>
                <button class="filter-pill" data-filter="gacha" onclick="setFilter('gacha', this)">가챠·굿즈</button>
                <button class="filter-pill" data-filter="done" onclick="setFilter('done', this)">완독</button>
            </div>

            <!-- 2-Column Editorial Card Grid (No cramped 3-col ellipsis!) -->
            <div id="shelf-grid" class="grid grid-cols-2 gap-3.5"></div>
        </main>

        <!-- Quotes Collection View (Tab 2) -->
        <main class="scroll-area px-5 hidden" id="view-quotes">
            <h2 class="text-[16px] font-bold mb-3 mt-1">밑줄 아카이브</h2>
            <div id="quotes-list" class="flex flex-col gap-3"></div>
        </main>

        <!-- Settings / Theme View (Tab 3) -->
        <main class="scroll-area px-5 hidden" id="view-settings">
            <h2 class="text-[16px] font-bold mb-3 mt-1">서재 설정 & 테마</h2>

            <div class="p-4 rounded-2xl mb-4" style="background: var(--surface); border: 1px solid var(--border);">
                <p class="text-[13px] font-bold mb-1">서재 이름 설정</p>
                <p class="text-[12px] mb-2.5" style="color: var(--ink-sub);">이름을 입력하면 'OOO의 서재'로 표시됩니다. 비워두면 '나의 서재'가 됩니다.</p>
                <div class="flex items-center gap-2">
                    <input id="owner-name-input" type="text" placeholder="이름 입력 (예: 주희, 민수)" onkeydown="if(event.key==='Enter') saveOwnerName()"
                        class="flex-1 px-3 py-2 rounded-xl text-[13px] outline-none"
                        style="background: var(--bg); border: 1px solid var(--border); color: var(--ink);">
                    <button onclick="saveOwnerName()" class="px-4 py-2 rounded-xl text-[13px] font-bold cursor-pointer" style="background: var(--ink); color: var(--bg);">적용</button>
                </div>
            </div>

            <div class="p-4 rounded-2xl mb-4" style="background: var(--surface); border: 1px solid var(--border);">
                <p class="text-[13px] font-bold mb-3">종이 테마 선택</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setTheme('cream')" class="p-3 rounded-xl border text-center cursor-pointer transition" style="background: #F8F5F0; color: #1F1A17; border-color: var(--border);">
                        <div class="w-5 h-5 rounded-full mx-auto mb-1.5 border" style="background: #FFFFFF; border-color: #DDD;"></div>
                        <span class="text-[12px] font-semibold">크림 페이퍼</span>
                    </button>
                    <button onclick="setTheme('sepia')" class="p-3 rounded-xl border text-center cursor-pointer transition" style="background: #F1E8D9; color: #2A2118; border-color: var(--border);">
                        <div class="w-5 h-5 rounded-full mx-auto mb-1.5 border" style="background: #E8DEC9; border-color: #C7B89E;"></div>
                        <span class="text-[12px] font-semibold">웜 세피아</span>
                    </button>
                    <button onclick="setTheme('dark')" class="p-3 rounded-xl border text-center cursor-pointer transition" style="background: #171513; color: #F3EFEA; border-color: #36312C;">
                        <div class="w-5 h-5 rounded-full mx-auto mb-1.5 border" style="background: #2C2824; border-color: #555;"></div>
                        <span class="text-[12px] font-semibold">미드나잇</span>
                    </button>
                </div>
            </div>

            <div class="p-4 rounded-2xl" style="background: var(--surface); border: 1px solid var(--border);">
                <p class="text-[13px] font-bold mb-1">서재 데이터 백업</p>
                <p class="text-[12px] mb-3" style="color: var(--ink-sub);">현재 기록된 모든 작품과 권별 밑줄을 JSON 파일로 내보냅니다.</p>
                <button onclick="exportBackup()" class="w-full py-2.5 rounded-xl text-[13px] font-bold cursor-pointer" style="background: var(--surface-soft); color: var(--ink);">JSON 백업 복사하기</button>
            </div>
        </main>

        <!-- Clean 3-Item Bottom Navigation Bar (No mock buttons!) -->
        <nav class="absolute bottom-0 inset-x-0 px-6 py-3 flex items-center justify-around border-t z-30" style="background: var(--surface); border-color: var(--border);">
            <button class="nav-tab flex flex-col items-center gap-0.5 cursor-pointer" data-tab="shelf" onclick="switchTab('shelf')" style="color: var(--accent);">
                <span class="text-[18px]">📚</span>
                <span class="text-[11px] font-bold">서재</span>
            </button>
            <button class="nav-tab flex flex-col items-center gap-0.5 cursor-pointer" data-tab="quotes" onclick="switchTab('quotes')" style="color: var(--ink-muted);">
                <span class="text-[18px]">🖋️</span>
                <span class="text-[11px] font-semibold">밑줄 노트</span>
            </button>
            <button class="nav-tab flex flex-col items-center gap-0.5 cursor-pointer" data-tab="settings" onclick="switchTab('settings')" style="color: var(--ink-muted);">
                <span class="text-[18px]">🎨</span>
                <span class="text-[11px] font-semibold">테마·설정</span>
            </button>
        </nav>

        <!-- Floating Ephemeral Toast (No permanent bar!) -->
        <div id="toast" class="floating-toast"></div>

        <!-- Detail Bottom Sheet (Clean 3-Tab Design — Replaces 29-Chip Clutter!) -->
        <div id="detail-sheet" class="sheet-backdrop" onclick="if(event.target===this) closeDetail()">
            <div class="sheet-panel">
                <div class="w-10 h-1 rounded-full mx-auto mt-3 mb-1 shrink-0" style="background: var(--border);"></div>
                <div class="px-5 pt-2 pb-3 flex items-start justify-between gap-3 border-b shrink-0" style="border-color: var(--border);">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div id="d-cover" class="w-14 h-[74px] rounded-lg shrink-0 shadow-md flex items-end p-1.5 text-white text-[9px] font-bold leading-tight"></div>
                        <div class="min-w-0">
                            <span id="d-badge" class="inline-block text-[10.5px] font-bold px-2 py-0.5 rounded-full mb-1"></span>
                            <h3 id="d-title" class="text-[17px] font-extrabold truncate"></h3>
                            <p id="d-author" class="text-[12.5px] mt-0.5" style="color: var(--ink-sub);"></p>
                        </div>
                    </div>
                    <button onclick="closeDetail()" class="w-8 h-8 rounded-full flex items-center justify-center text-[15px] shrink-0 cursor-pointer" style="background: var(--surface-soft); color: var(--ink);">✕</button>
                </div>

                <!-- 3 Clean Segmented Tabs -->
                <div class="px-5 pt-3 pb-2 shrink-0">
                    <div class="seg-wrap">
                        <button class="seg-btn active" id="seg-vols" onclick="switchDetailTab('vols')">권별 기록</button>
                        <button class="seg-btn" id="seg-memo" onclick="switchDetailTab('memo')">감상·밑줄</button>
                        <button class="seg-btn" id="seg-info" onclick="switchDetailTab('info')">소장 정보</button>
                    </div>
                </div>

                <!-- Tab Panels -->
                <div class="flex-1 overflow-y-auto px-5 py-3 space-y-3" style="scrollbar-width: none;">
                    <!-- Panel 1: Volumes -->
                    <div id="panel-vols" class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span id="d-vol-summary" class="text-[12.5px] font-bold" style="color: var(--ink-sub);"></span>
                            <button onclick="addVolume()" class="px-3 py-1.5 rounded-full text-[12px] font-bold cursor-pointer" style="background: var(--ink); color: var(--bg);">+ 다음 권 추가</button>
                        </div>
                        <div id="d-vol-list" class="space-y-2"></div>
                    </div>

                    <!-- Panel 2: Memo & Ink -->
                    <div id="panel-memo" class="hidden space-y-3.5">
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="text-[12.5px] font-bold" style="color: var(--ink-sub);">대표 감상 & 밑줄</label>
                                <button id="d-hl-btn" onclick="toggleHighlight()" class="text-[11.5px] font-bold px-2.5 py-1 rounded-full cursor-pointer border" style="border-color: var(--border);">형광펜 OFF</button>
                            </div>
                            <div id="d-memo-preview" class="p-3.5 rounded-xl text-[14px] leading-relaxed mb-2.5" style="background: var(--surface); border: 1px solid var(--border);"></div>
                            <textarea id="d-memo-input" rows="3" class="w-full p-3 rounded-xl text-[13.5px] outline-none resize-none" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);" placeholder="기억하고 싶은 문장이나 감상을 적어보세요"></textarea>
                            <button onclick="saveMemo()" class="mt-2 w-full py-2.5 rounded-xl text-[13px] font-bold cursor-pointer" style="background: var(--ink); color: var(--bg);">감상 저장</button>
                        </div>

                        <div class="p-3.5 rounded-xl" style="background: var(--surface); border: 1px solid var(--border);">
                            <p class="text-[12px] font-bold mb-2.5" style="color: var(--ink-sub);">만년필 잉크 컬러</p>
                            <div class="flex items-center gap-2.5" id="d-ink-row"></div>
                        </div>
                    </div>

                    <!-- Panel 3: Clean Metadata Form (Direct inputs instead of endless click cyclers!) -->
                    <div id="panel-info" class="hidden space-y-3">
                        <div class="p-4 rounded-2xl space-y-3" style="background: var(--surface); border: 1px solid var(--border);">
                            <div>
                                <label class="block text-[12px] font-bold mb-1" style="color: var(--ink-sub);">소장 상태 도장</label>
                                <div class="flex flex-wrap gap-1.5" id="d-stamp-row"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2.5">
                                <div>
                                    <label class="block text-[12px] font-bold mb-1" style="color: var(--ink-sub);">추정 가치 (원)</label>
                                    <input id="d-price-input" type="number" step="1000" class="w-full px-3 py-2 rounded-xl text-[13px] outline-none" style="background: var(--bg); border: 1px solid var(--border); color: var(--ink);">
                                </div>
                                <div>
                                    <label class="block text-[12px] font-bold mb-1" style="color: var(--ink-sub);">보관 위치</label>
                                    <input id="d-loc-input" type="text" class="w-full px-3 py-2 rounded-xl text-[13px] outline-none" style="background: var(--bg); border: 1px solid var(--border); color: var(--ink);">
                                </div>
                            </div>
                            <button onclick="saveInfo()" class="w-full py-2.5 rounded-xl text-[13px] font-bold cursor-pointer" style="background: var(--ink); color: var(--bg);">소장 정보 저장</button>
                        </div>

                        <button onclick="deleteCurrentItem()" class="w-full py-2.5 rounded-xl text-[13px] font-bold cursor-pointer" style="background: #FEECEC; color: #C53030;">이 작품 기록 삭제</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Record Bottom Sheet -->
        <div id="add-sheet" class="sheet-backdrop" onclick="if(event.target===this) closeAddModal()">
            <div class="sheet-panel">
                <div class="w-10 h-1 rounded-full mx-auto mt-3 mb-1 shrink-0" style="background: var(--border);"></div>
                <div class="px-5 py-3 flex items-center justify-between border-b" style="border-color: var(--border);">
                    <h3 class="text-[16px] font-extrabold">새 소장 기록</h3>
                    <button onclick="closeAddModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-[15px] cursor-pointer" style="background: var(--surface-soft);">✕</button>
                </div>
                <div class="p-5 space-y-3.5 overflow-y-auto">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="add-cat-book" onclick="selectAddCat('book')" class="py-2.5 rounded-xl text-[13px] font-bold border cursor-pointer" style="background: var(--ink); color: var(--bg); border-color: var(--ink);">만화·도서</button>
                        <button id="add-cat-gacha" onclick="selectAddCat('gacha')" class="py-2.5 rounded-xl text-[13px] font-bold border cursor-pointer" style="background: var(--surface); color: var(--ink-sub); border-color: var(--border);">가챠·굿즈</button>
                    </div>
                    <input id="add-title" type="text" placeholder="작품명 또는 굿즈 이름 *" class="w-full px-3.5 py-2.5 rounded-xl text-[13.5px] outline-none" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="add-author" type="text" placeholder="작가 / 브랜드" class="w-full px-3.5 py-2.5 rounded-xl text-[13px] outline-none" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">
                        <input id="add-price" type="number" placeholder="가격 (원)" class="w-full px-3.5 py-2.5 rounded-xl text-[13px] outline-none" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">
                    </div>
                    <input id="add-quote" type="text" placeholder="기억하고 싶은 첫 문장 또는 메모" class="w-full px-3.5 py-2.5 rounded-xl text-[13px] outline-none" style="background: var(--surface); border: 1px solid var(--border); color: var(--ink);">

                    <div>
                        <p class="text-[12px] font-bold mb-2" style="color: var(--ink-sub);">표지 컬러 또는 사진</p>
                        <div class="flex items-center gap-2 mb-2.5" id="add-color-row"></div>
                        <label class="block w-full py-2 px-3 rounded-xl text-[12px] font-semibold text-center cursor-pointer border border-dashed" style="border-color: var(--border); color: var(--ink-sub); background: var(--surface);">
                            📷 로컬 표지 사진 첨부 (선택)
                            <input id="add-img-file" type="file" accept="image/*" class="hidden" onchange="handleCoverUpload(event)">
                        </label>
                    </div>

                    <button onclick="submitAdd()" class="w-full py-3 rounded-xl text-[14px] font-bold cursor-pointer" style="background: var(--accent); color: #fff;">서재에 등록하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const INKS = [
            { name: '에스프레소', color: '#2C221E' },
            { name: '버건디', color: '#8C2D3B' },
            { name: '세피아', color: '#7D542E' },
            { name: '포레스트', color: '#2E5947' }
        ];
        const STAMPS = ['전권완결', '초판특전', '인생최애', '소장중', '위시'];
        const COVER_COLORS = ['#B91C1C', '#0369A1', '#C2410C', '#BE185D', '#6D28D9', '#2E5947'];

        let items = [
            {
                id: 1, category: 'book', title: '슬램덩크 신장재편판', author: '이노우에 다케히코',
                color: '#C82342', pattern: 'cover-pattern-stripe', coverImage: '',
                stamp: '전권완결', targetVols: 3, price: 21000, location: '거실 책장 1층',
                memo: '인생 최고의 농구 만화. 일러스트 표지 신장재편판.', ink: '#2C221E', highlight: true,
                volumes: [
                    { vol: 1, first: true, rating: 5, date: '11.22', quote: '농구... 좋아하세요?' },
                    { vol: 2, first: false, rating: 5, date: '11.22', quote: '리바운드를 제압하는 자가 시합을 제압한다.' },
                    { vol: 3, first: true, rating: 5, date: '11.22', quote: '포기하면 그 순간이 바로 시합 종료예요.' }
                ]
            },
            {
                id: 2, category: 'book', title: '장송의 프리렌', author: '야마다 카네히토',
                color: '#0077B6', pattern: 'cover-pattern-grid', coverImage: '',
                stamp: '초판특전', targetVols: 4, price: 21000, location: '침대 옆 협탁',
                memo: '여운이 길게 남는 여행 판타지. 초판 투명 북마크 동봉.', ink: '#2E5947', highlight: false,
                volumes: [
                    { vol: 1, first: true, rating: 5, date: '11.18', quote: '힘멜이라면 그렇게 했을 거니까.' },
                    { vol: 2, first: true, rating: 5, date: '11.19', quote: '인간을 더 알아가기 위한 여행.' },
                    { vol: 3, first: false, rating: 5, date: '11.21', quote: '짧은 시간이라도 함께 걸었던 기억.' }
                ]
            },
            {
                id: 3, category: 'gacha', title: '치이카와 캡슐 피규어', author: '반다이 가샤폰',
                color: '#DB2777', pattern: 'cover-pattern-grid', coverImage: '',
                stamp: '인생최애', targetVols: 1, price: 5000, location: '책상 아크릴 케이스',
                memo: '국전 가챠샵에서 단번에 뽑은 시크릿 피규어!', ink: '#8C2D3B', highlight: false,
                volumes: [{ vol: 1, first: true, rating: 5, date: '11.20', quote: '국전 가챠샵에서 단번에 뽑은 최애!' }]
            },
            {
                id: 4, category: 'book', title: '하이큐!! 파이널 가이드', author: '후루다테 하루이치',
                color: '#D9480F', pattern: 'cover-pattern-stripe', coverImage: '',
                stamp: '전권완결', targetVols: 2, price: 14000, location: '거실 책장 2층',
                memo: '쓰레기장의 결전 기념판. 컬러 일러스트 수록.', ink: '#2C221E', highlight: false,
                volumes: [
                    { vol: 1, first: true, rating: 5, date: '11.15', quote: '날아라 카라스노!' },
                    { vol: 2, first: false, rating: 5, date: '11.16', quote: '재능은 꽃피우는 것, 센스는 갈고닦는 것.' }
                ]
            },
            {
                id: 5, category: 'book', title: '카드캡터 체리 애장판', author: 'CLAMP',
                color: '#E11D48', pattern: 'cover-pattern-grid', coverImage: '',
                stamp: '인생최애', targetVols: 4, price: 14000, location: '유리 장식장',
                memo: '크로우카드 일러스트가 수록된 소장용 애장판.', ink: '#8C2D3B', highlight: true,
                volumes: [
                    { vol: 1, first: true, rating: 5, date: '11.12', quote: '봉인해제(릴리즈)!' },
                    { vol: 2, first: true, rating: 5, date: '11.14', quote: '절대 괜찮을 거야.' }
                ]
            },
            {
                id: 6, category: 'gacha', title: '루나 요술봉 아크릴', author: '한정판 캡슐 토이',
                color: '#6D28D9', pattern: 'cover-pattern-stripe', coverImage: '',
                stamp: '초판특전', targetVols: 1, price: 5000, location: '책상 위 스탠드',
                memo: '책상 위 아크릴 스탠드 보물 1호.', ink: '#2C221E', highlight: false,
                volumes: [{ vol: 1, first: true, rating: 5, date: '11.22', quote: '책상 위 아크릴 스탠드 보물 1호.' }]
            }
        ];

        let currentFilter = 'all';
        let activeItemId = null;
        let quoteIdx = 0;
        let addCat = 'book';
        let addColor = COVER_COLORS[0];
        let addCoverImage = '';
        let toastTimer = null;

        function fmtKRW(n) { return '₩' + Number(n || 0).toLocaleString('ko-KR'); }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        function getAvgRating(item) {
            if (!item.volumes.length) return 5.0;
            return item.volumes.reduce((s, v) => s + v.rating, 0) / item.volumes.length;
        }

        function getProgress(item) {
            const target = Math.max(1, item.targetVols || item.volumes.length);
            return Math.min(100, Math.round((item.volumes.length / target) * 100));
        }

        function getAllQuotes() {
            const list = [];
            items.forEach(it => {
                it.volumes.forEach(v => {
                    if (v.quote) list.push({ item: it, vol: v.vol, quote: v.quote });
                });
            });
            return list;
        }

        function renderHeaderStats() {
            const totalVols = items.reduce((s, it) => s + it.volumes.length, 0);
            const totalVal = items.reduce((s, it) => s + Number(it.price || 0), 0);
            const avgRate = items.length ? Math.round(items.reduce((s, it) => s + getProgress(it), 0) / items.length) : 0;
            document.getElementById('stat-items').textContent = items.length;
            document.getElementById('stat-vols').textContent = totalVols;
            document.getElementById('stat-rate').textContent = avgRate + '%';
            document.getElementById('stat-value').textContent = fmtKRW(totalVal);
        }

        function renderQuoteCard() {
            const quotes = getAllQuotes();
            if (!quotes.length) return;
            const q = quotes[quoteIdx % quotes.length];
            document.getElementById('quote-text').textContent = `"${q.quote}"`;
            document.getElementById('quote-meta').textContent = `${q.item.title} ${q.vol}권 · ${q.item.author}`;
        }

        function cycleQuote() {
            quoteIdx++;
            renderQuoteCard();
        }

        function openQuoteSource() {
            const quotes = getAllQuotes();
            if (!quotes.length) return;
            openDetail(quotes[quoteIdx % quotes.length].item.id);
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderShelf();
        }

        function renderShelf() {
            renderHeaderStats();
            renderQuoteCard();
            const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
            const sort = document.getElementById('sort-select').value;

            let list = items.filter(it => {
                if (currentFilter === 'book' && it.category !== 'book') return false;
                if (currentFilter === 'gacha' && it.category !== 'gacha') return false;
                if (currentFilter === 'done' && getProgress(it) < 100) return false;
                if (q) {
                    const hay = `${it.title} ${it.author} ${it.memo} ${it.volumes.map(v => v.quote).join(' ')}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            if (sort === 'rating') list.sort((a, b) => getAvgRating(b) - getAvgRating(a));
            else if (sort === 'value') list.sort((a, b) => (b.price || 0) - (a.price || 0));
            else if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'ko'));

            const grid = document.getElementById('shelf-grid');
            if (!list.length) {
                grid.innerHTML = `<div class="col-span-2 py-12 text-center text-[13px]" style="color: var(--ink-muted);">조건에 맞는 작품이 없습니다.</div>`;
                return;
            }

            grid.innerHTML = list.map(it => {
                const prog = getProgress(it);
                const bgStyle = it.coverImage
                    ? `background-image: url('${it.coverImage}');`
                    : `background-color: ${it.color};`;
                return `
                    <article onclick="openDetail(${it.id})" class="rounded-2xl p-2.5 cursor-pointer transition active:scale-[0.98]" style="background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);">
                        <div class="book-cover ${it.coverImage ? '' : it.pattern}" style="${bgStyle}">
                            <div class="relative z-10 flex items-center justify-between">
                                <span class="text-[9.5px] font-bold tracking-wider uppercase px-2 py-0.5 rounded-full" style="background: rgba(0,0,0,0.32); backdrop-filter: blur(4px);">
                                    ${it.category === 'book' ? 'BOOK' : 'GOODS'}
                                </span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background: rgba(255,255,255,0.22); backdrop-filter: blur(4px);">
                                    ${it.stamp}
                                </span>
                            </div>
                            <div class="relative z-10">
                                <p class="text-[14px] font-extrabold leading-snug drop-shadow-sm line-clamp-2">${it.title}</p>
                                <p class="text-[10.5px] opacity-85 mt-0.5 truncate">${it.author}</p>
                            </div>
                        </div>
                        <div class="px-1 pt-2.5">
                            <div class="flex items-center justify-between text-[11.5px] mb-1.5">
                                <span class="font-bold" style="color: var(--ink);">${it.category === 'book' ? it.volumes.length + '권' : '소장'} · ★${getAvgRating(it).toFixed(1)}</span>
                                <span class="font-semibold" style="color: var(--ink-sub);">${fmtKRW(it.price)}</span>
                            </div>
                            <div class="h-1.5 rounded-full overflow-hidden" style="background: var(--surface-soft);">
                                <div class="h-full rounded-full" style="width: ${prog}%; background: ${prog >= 100 ? 'var(--sage)' : 'var(--accent)'};"></div>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function renderQuotesTab() {
            const list = getAllQuotes();
            document.getElementById('quotes-list').innerHTML = list.map(q => `
                <div onclick="openDetail(${q.item.id})" class="p-4 rounded-2xl cursor-pointer" style="background: var(--surface); border: 1px solid var(--border);">
                    <p class="text-[14px] font-semibold leading-relaxed" style="color: ${q.item.ink || 'var(--ink)'};">"${q.quote}"</p>
                    <div class="flex items-center justify-between mt-2 text-[11.5px]" style="color: var(--ink-sub);">
                        <span>${q.item.title} · ${q.vol}권</span>
                        <span>${q.item.author}</span>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            ['shelf', 'quotes', 'settings'].forEach(t => {
                document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
            });
            document.querySelectorAll('.nav-tab').forEach(btn => {
                const active = btn.dataset.tab === tab;
                btn.style.color = active ? 'var(--accent)' : 'var(--ink-muted)';
            });
            if (tab === 'quotes') renderQuotesTab();
        }

        function openDetail(id) {
            activeItemId = id;
            const it = items.find(x => x.id === id);
            if (!it) return;

            const cov = document.getElementById('d-cover');
            cov.style.background = it.coverImage ? `url('${it.coverImage}') center/cover` : it.color;
            cov.textContent = it.coverImage ? '' : it.title.slice(0, 6);

            const badge = document.getElementById('d-badge');
            badge.textContent = it.stamp;
            badge.style.background = 'var(--accent-soft)';
            badge.style.color = 'var(--accent)';

            document.getElementById('d-title').textContent = it.title;
            document.getElementById('d-author').textContent = `${it.author} · ★${getAvgRating(it).toFixed(1)} · ${fmtKRW(it.price)}`;

            renderDetailPanels(it);
            switchDetailTab('vols');
            document.getElementById('detail-sheet').classList.add('open');
        }

        function closeDetail() {
            document.getElementById('detail-sheet').classList.remove('open');
        }

        function switchDetailTab(tab) {
            ['vols', 'memo', 'info'].forEach(t => {
                document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
                document.getElementById('seg-' + t).classList.toggle('active', t === tab);
            });
        }

        function renderDetailPanels(it) {
            // 1. Volumes
            const firstCnt = it.volumes.filter(v => v.first).length;
            document.getElementById('d-vol-summary').textContent = `총 ${it.volumes.length}권 · 초판 ${firstCnt}권 · 완독 ${getProgress(it)}%`;
            document.getElementById('d-vol-list').innerHTML = it.volumes.map((v, idx) => `
                <div class="p-3.5 rounded-2xl space-y-2" style="background: var(--surface); border: 1px solid var(--border);">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-[13.5px] font-extrabold">${v.vol}권</span>
                            <button onclick="toggleVolFirst(${idx})" class="text-[11px] font-bold px-2 py-0.5 rounded-full cursor-pointer"
                                style="background: ${v.first ? 'var(--accent-soft)' : 'var(--sage-soft)'}; color: ${v.first ? 'var(--accent)' : 'var(--sage)'};">
                                ${v.first ? '초판특전' : '소장완료'}
                            </button>
                            <span class="text-[11px]" style="color: var(--ink-muted);">${v.date}</span>
                        </div>
                        <button onclick="cycleVolStar(${idx})" class="text-[13px] tracking-tight cursor-pointer" style="color: #D97706;">${'★'.repeat(v.rating)}${'☆'.repeat(5 - v.rating)}</button>
                    </div>
                    <input type="text" value="${(v.quote || '').replace(/"/g, '&quot;')}" onchange="updateVolQuote(${idx}, this.value)"
                        placeholder="이 권의 밑줄 문장을 입력하세요"
                        class="w-full px-3 py-2 rounded-xl text-[12.5px] outline-none"
                        style="background: var(--bg); border: 1px solid var(--border); color: var(--ink);">
                </div>
            `).join('');

            // 2. Memo & Ink
            const prev = document.getElementById('d-memo-preview');
            prev.style.color = it.ink || 'var(--ink)';
            prev.innerHTML = it.highlight ? `<span class="hl-mark">"${it.memo || '감상평을 남겨보세요.'}"</span>` : `"${it.memo || '감상평을 남겨보세요.'}"`;
            document.getElementById('d-memo-input').value = it.memo || '';
            const hlBtn = document.getElementById('d-hl-btn');
            hlBtn.textContent = it.highlight ? '형광펜 ON' : '형광펜 OFF';
            hlBtn.style.background = it.highlight ? '#FEF08A' : 'var(--surface)';
            hlBtn.style.color = it.highlight ? '#854D0E' : 'var(--ink-sub)';

            document.getElementById('d-ink-row').innerHTML = INKS.map(ink => `
                <button onclick="setInk('${ink.color}')" class="flex-1 py-2 rounded-xl text-[11.5px] font-bold cursor-pointer border-2"
                    style="background: var(--bg); color: ${ink.color}; border-color: ${it.ink === ink.color ? ink.color : 'transparent'};">
                    ${ink.name}
                </button>
            `).join('');

            // 3. Info
            document.getElementById('d-stamp-row').innerHTML = STAMPS.map(st => `
                <button onclick="setStamp('${st}')" class="px-3 py-1.5 rounded-full text-[12px] font-bold cursor-pointer border"
                    style="background: ${it.stamp === st ? 'var(--ink)' : 'var(--bg)'}; color: ${it.stamp === st ? 'var(--bg)' : 'var(--ink-sub)'}; border-color: var(--border);">
                    ${st}
                </button>
            `).join('');
            document.getElementById('d-price-input').value = it.price || 0;
            document.getElementById('d-loc-input').value = it.location || '';
        }

        function getActiveItem() { return items.find(x => x.id === activeItemId); }

        function addVolume() {
            const it = getActiveItem();
            if (!it) return;
            const nextV = it.volumes.length + 1;
            it.volumes.push({ vol: nextV, first: false, rating: 5, date: '11.22', quote: '' });
            renderDetailPanels(it);
            renderShelf();
            showToast(`${nextV}권 기록을 추가했어요`);
        }

        function toggleVolFirst(idx) {
            const it = getActiveItem();
            it.volumes[idx].first = !it.volumes[idx].first;
            renderDetailPanels(it);
            renderShelf();
        }

        function cycleVolStar(idx) {
            const it = getActiveItem();
            it.volumes[idx].rating = (it.volumes[idx].rating % 5) + 1;
            renderDetailPanels(it);
            renderShelf();
        }

        function updateVolQuote(idx, val) {
            const it = getActiveItem();
            it.volumes[idx].quote = val.trim();
            renderQuoteCard();
            showToast('밑줄 문장을 저장했어요');
        }

        function toggleHighlight() {
            const it = getActiveItem();
            it.highlight = !it.highlight;
            renderDetailPanels(it);
        }

        function setInk(col) {
            const it = getActiveItem();
            it.ink = col;
            renderDetailPanels(it);
        }

        function saveMemo() {
            const it = getActiveItem();
            it.memo = document.getElementById('d-memo-input').value.trim();
            renderDetailPanels(it);
            showToast('감상평을 저장했어요');
        }

        function setStamp(st) {
            const it = getActiveItem();
            it.stamp = st;
            document.getElementById('d-badge').textContent = st;
            renderDetailPanels(it);
            renderShelf();
        }

        function saveInfo() {
            const it = getActiveItem();
            it.price = Math.max(0, Number(document.getElementById('d-price-input').value) || 0);
            it.location = document.getElementById('d-loc-input').value.trim();
            document.getElementById('d-author').textContent = `${it.author} · ★${getAvgRating(it).toFixed(1)} · ${fmtKRW(it.price)}`;
            renderShelf();
            showToast('소장 정보를 업데이트했어요');
        }

        function deleteCurrentItem() {
            items = items.filter(x => x.id !== activeItemId);
            closeDetail();
            renderShelf();
            showToast('작품 기록을 삭제했어요');
        }

        function openAddModal() {
            addCat = 'book';
            addColor = COVER_COLORS[0];
            addCoverImage = '';
            document.getElementById('add-title').value = '';
            document.getElementById('add-author').value = '';
            document.getElementById('add-price').value = '';
            document.getElementById('add-quote').value = '';
            renderAddColors();
            document.getElementById('add-sheet').classList.add('open');
        }

        function closeAddModal() {
            document.getElementById('add-sheet').classList.remove('open');
        }

        function selectAddCat(c) {
            addCat = c;
            const b = document.getElementById('add-cat-book');
            const g = document.getElementById('add-cat-gacha');
            b.style.background = c === 'book' ? 'var(--ink)' : 'var(--surface)';
            b.style.color = c === 'book' ? 'var(--bg)' : 'var(--ink-sub)';
            g.style.background = c === 'gacha' ? 'var(--ink)' : 'var(--surface)';
            g.style.color = c === 'gacha' ? 'var(--bg)' : 'var(--ink-sub)';
        }

        function renderAddColors() {
            document.getElementById('add-color-row').innerHTML = COVER_COLORS.map(c => `
                <button onclick="addColor='${c}'; renderAddColors();" class="w-8 h-8 rounded-full cursor-pointer transition"
                    style="background:${c}; box-shadow: ${addColor === c ? '0 0 0 2px var(--bg), 0 0 0 4px ' + c : 'none'};"></button>
            `).join('');
        }

        function handleCoverUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                addCoverImage = ev.target.result;
                showToast('표지 사진을 불러왔어요');
            };
            reader.readAsDataURL(file);
        }

        function submitAdd() {
            const title = document.getElementById('add-title').value.trim();
            if (!title) { showToast('작품명을 입력해 주세요'); return; }
            const author = document.getElementById('add-author').value.trim() || '작가 미상';
            const price = Math.max(0, Number(document.getElementById('add-price').value) || 0);
            const quote = document.getElementById('add-quote').value.trim();

            items.unshift({
                id: Date.now(), category: addCat, title, author,
                color: addColor, pattern: 'cover-pattern-grid', coverImage: addCoverImage,
                stamp: '소장중', targetVols: 1, price, location: '내 서재',
                memo: quote || '새롭게 추가한 소장 기록', ink: '#2C221E', highlight: false,
                volumes: [{ vol: 1, first: false, rating: 5, date: '11.22', quote }]
            });
            closeAddModal();
            renderShelf();
            showToast(`「${title}」 기록을 추가했어요`);
        }

        function saveOwnerName() {
            const val = (document.getElementById('owner-name-input').value || '').trim();
            const title = val ? `${val}의 서재` : '나의 서재';
            document.getElementById('library-title').textContent = title;
            showToast(`서재 이름을 '${title}'(으)로 변경했어요`);
        }

        function setTheme(t) {
            document.getElementById('app').dataset.theme = t;
            showToast('서재 테마를 변경했어요');
        }

        function exportBackup() {
            navigator.clipboard?.writeText(JSON.stringify(items, null, 2)).catch(() => {});
            showToast('서재 JSON 백업을 클립보드에 복사했어요');
        }

        renderShelf();
    </script>
</body>
</html>
